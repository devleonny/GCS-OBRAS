    <script>
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', async () => {
                try {
                    const reg = await navigator.serviceWorker.register('/sw.js')
                    console.log('SW ok', reg.scope)
                } catch (err) {
                    console.error('Erro SW', err)
                }
            })
        }

    </script>


    <script>

        const versaoAtual = 9.13

        verificarVersao()

        setInterval(async () => (
            verificarVersao()
        ), 15 * 60 * 1000)

        async function verificarVersao() {

            const resposta = await fetch(`${read}/versao`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })

            if (!resposta.ok) {
                const erro = await resposta.text()
                throw new Error(erro || 'Erro ao contar por campo')
            }

            const { versao = null } = await resposta.json()

            if (!versao)
                return

            if (versao > versaoAtual)
                balaoNotificacao({
                    imagem: 'imagens/atualizacao.png',
                    texto: `
                            <div style="${horizontal}; gap: 5px;">
                                <span>Nova versão disponível</span>
                                <button onclick="window.location.reload()">Atualizar</button>
                                <button style="background-color: #097fe6;" onclick="this.closest('.popup-mensagem').remove()">Adiar</button>
                            </div>
                            `,
                    tempo: 0 // Sempre
                })


        }


    </script>
