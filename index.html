    <script>

        // Carimbado por scripts/versionar.js no commit; comparado com versao.json publicado.
        const versaoAtual = 'f02228dc'
        // Mesma versão sem os CSS: se só ela bate com a publicada, a mudança foi só de CSS.
        const versaoBase = '4a468cfa'
        // Versão em uso: muda quando a página troca os CSS sozinha.
        let versaoCarregada = versaoAtual

        verificarVersao()

        setInterval(verificarVersao, 30 * 60 * 1000)

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible')
                verificarVersao()
        })

        // Fechado pelo X ou por "Lembrar mais tarde", o aviso só volta depois de 30 min
        // (vale também para a volta à aba, que confere a versão de novo).
        let versaoAdiadaAte = 0
        function adiarAvisoVersao(botao) {
            versaoAdiadaAte = Date.now() + 30 * 60 * 1000
            botao.closest('.popup-mensagem')?.remove()
        }

        async function verificarVersao() {

            const avisoAberto = () => document.querySelector('.aviso-versao')

            if (avisoAberto() || location.protocol === 'file:' || Date.now() < versaoAdiadaAte)
                return

            try {
                const resposta = await fetch(`versao.json?t=${Date.now()}`, { cache: 'no-store' })
                if (!resposta.ok)
                    return

                const { versao = null, base = null, css = null } = await resposta.json()

                if (!versao || versao === String(versaoCarregada) || avisoAberto())
                    return

                // Só CSS mudou: troca os arquivos na página aberta, sem aviso.
                if (versaoBase && base === versaoBase && css) {
                    await trocarCssAlterados(css)
                    versaoCarregada = versao
                    return
                }

                balaoNotificacao({
                    imagem: 'imagens/atualizacao.png',
                    texto: `
                            <div class="aviso-versao">
                                <strong>Nova versão disponível</strong>
                                <span>Atualize para carregar as últimas melhorias.</span>
                                <div class="aviso-versao-botoes">
                                    <button type="button" class="aviso-versao-atualizar" onclick="atualizarVersao()">Atualizar agora</button>
                                    <button type="button" class="aviso-versao-adiar" onclick="adiarAvisoVersao(this)">Lembrar mais tarde</button>
                                </div>
                            </div>
                            `,
                    tempo: 0 // Sempre
                })
                // O X do balão também adia.
                const aviso = avisoAberto()?.closest('.popup-mensagem')
                aviso?.querySelector('.popup-mensagem-fechar')
                    ?.addEventListener('click', () => { versaoAdiadaAte = Date.now() + 30 * 60 * 1000 })
            } catch {
                // Sem rede: tenta no próximo ciclo.
            }

        }

        // Troca cada <link> de CSS cuja versão mudou. O novo entra ao lado do antigo e o
        // antigo só sai depois que o novo carregar, para a tela não piscar sem estilo.
        async function trocarCssAlterados(css) {
            const links = [...document.querySelectorAll('link[rel="stylesheet"][href^="css/"]')]
            await Promise.all(links.map(link => {
                const [arquivo, query = ''] = link.getAttribute('href').split('?')
                const nova = css[arquivo]
                if (!nova || new URLSearchParams(query).get('v') === nova) return null

                return new Promise(resolve => {
                    const novo = link.cloneNode()
                    novo.href = `${arquivo}?v=${nova}`
                    novo.onload = () => { link.remove(); resolve() }
                    novo.onerror = () => { novo.remove(); resolve() }
                    link.after(novo)
                })
            }))

            // Mapa usado por quem monta URL de CSS fora do HTML (pdf() em ferramentas.js).
            if (typeof VERSOES_CSS !== 'undefined')
                for (const [arquivo, hash] of Object.entries(css))
                    VERSOES_CSS[arquivo.replace(/^css\//, '').replace(/\.css$/, '')] = hash
        }

        // Renova o index.html no cache do navegador antes de recarregar.
        async function atualizarVersao() {
            try {
                await fetch(location.href, { cache: 'reload' })
            } catch { }
            location.reload()
        }


    </script>
