        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', async () => {
                try {
                    const reg = await navigator.serviceWorker.register('/sw.js')
                    console.log('SW ok', reg.scope)
                } catch (err) {
                    console.error('Erro SW', err)
                }
            })
        }

    </script>


    <script>

        // Carimbado por scripts/versionar.js no commit; comparado com versao.json publicado.
        const versaoAtual = '98e5f128'

        verificarVersao()

        setInterval(verificarVersao, 5 * 60 * 1000)

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible')
                verificarVersao()
        })

        async function verificarVersao() {

            // O aviso na tela é o próprio controle: fechado pelo X ou por Adiar, volta no próximo ciclo.
            const avisoAberto = () => document.querySelector('.aviso-versao')

            if (avisoAberto() || location.protocol === 'file:')
                return

            try {
                const resposta = await fetch(`versao.json?t=${Date.now()}`, { cache: 'no-store' })
                if (!resposta.ok)
                    return

                const { versao = null } = await resposta.json()

                if (!versao || versao === String(versaoAtual) || avisoAberto())
                    return

                balaoNotificacao({
                    imagem: 'imagens/atualizacao.png',
                    texto: `
                            <div class="aviso-versao">
                                <strong>Nova versão disponível</strong>
                                <span>Atualize para carregar as últimas melhorias.</span>
                                <div class="aviso-versao-botoes">
                                    <button type="button" class="aviso-versao-atualizar" onclick="atualizarVersao()">Atualizar agora</button>
                                    <button type="button" class="aviso-versao-adiar" onclick="this.closest('.popup-mensagem').remove()">Lembrar mais tarde</button>
                                </div>
                            </div>
                            `,
                    tempo: 0 // Sempre
                })
            } catch {
                // Sem rede: tenta no próximo ciclo.
            }

        }

        // Renova o index.html no cache do navegador antes de recarregar.
        async function atualizarVersao() {
            try {
                await fetch(location.href, { cache: 'reload' })
            } catch { }
            location.reload()
        }


    </script>
